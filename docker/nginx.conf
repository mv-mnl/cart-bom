server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /health {
    default_type application/json;
    return 200 '{"ok":true}';
  }

  # El servidor de Colyseus en el mismo dominio: matchmaking por HTTP y partidas por WebSocket.
  location /servidor/ {
    proxy_pass http://server:2567/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Una partida puede estar quieta un rato: que no se corte la conexión.
    proxy_read_timeout 1h;
  }

  # El JS y el CSS de Vite llevan hash en el nombre: no cambian nunca. Los sonidos de
  # /assets/sounds/ no llevan hash (se reemplazan con el mismo nombre): esos no.
  location ~* ^/assets/[^/]+\.(js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Las rutas de React caen en index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
