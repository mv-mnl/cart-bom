services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 2567
    ports:
      - '${PUERTO_SERVIDOR:-2567}:2567'
    init: true
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      args:
        VITE_SERVIDOR: ${VITE_SERVIDOR:-}
    ports:
      - '${PUERTO_CLIENTE:-8080}:80'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # Publica el juego en tu dominio con Cloudflare Tunnel (HTTPS, sin abrir puertos).
  # Solo arranca con: docker compose --profile cloudflare up -d
  # En Cloudflare, el "public hostname" del túnel apunta a http://client:80.
  tunel:
    image: cloudflare/cloudflared:2026.9.1
    profiles: ['cloudflare']
    command: tunnel --no-autoupdate run
    environment:
      # Sin token, cloudflared no arranca y lo dice en sus logs.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      client:
        condition: service_healthy
    restart: unless-stopped
